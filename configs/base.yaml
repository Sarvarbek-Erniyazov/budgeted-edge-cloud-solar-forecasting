# Single source for splits, seeds and budgets. All timestamps are UTC, as in the dataset.
data:
  raw_dir: data/raw
  task: intra-day            # benchmark task; horizons are read from Target_intra-day.csv
split:
  models_train: ["2014-01-01", "2014-12-31"]
  gate_fit:     ["2015-01-01", "2015-06-30"]
  validation:   ["2015-07-01", "2015-12-31"]
  test:         ["2016-01-01", "2016-12-31"]
  provisional: false         # frozen on Oct 8 after the data audit; see results/audit/AUDIT.md
protocol:
  frozen: false              # set true on Oct 12; only then may the test year be loaded
seeds: [0, 1, 2, 3, 4]
budget:
  targets: [0.0, 0.05, 0.10, 0.15, 0.20, 0.25, 0.30, 0.40, 0.50, 0.60, 0.75, 1.0]
  report_at: [0.10, 0.25, 0.50]
gates: [random, fixed_interval, variability, uncertainty, learned, oracle]
go_no_go:
  min_rmse_gain: 0.05        # cloud vs edge on validation; suggested threshold
bootstrap:
  block: day                 # local standard-time day, 08 UTC to 08 UTC
  n_resamples: 2000
  seed: 0
  ci: 0.95
site:                        # inferred from the data, see results/audit/task_definition.md:
  latitude: 38.6435          # exact fit of pvlib solar elevation (mean over the 30 minutes of each
  longitude: -121.1477       # target window) to the benchmark's elevation_* columns
  altitude: 54.0             # m; pvlib.location.lookup_altitude at the coordinates above
clearsky:
  model: ineichen            # pvlib, Linke turbidity climatology
  daylight_min_elevation: 5.0  # degrees; same night cut as the benchmark scripts
  max_kt: 1.2                # cap on the clear-sky index, as in the benchmark target files
sky:                         # daily sky class from clear-sky-index level and variability
  resample: 10min            # kt averaged to this step before the daily statistics
  min_elevation: 10.0        # degrees; only these daylight samples enter the daily statistics
  min_coverage: 0.8          # share of expected samples needed to classify a day
  clear_min_mean_kt: 0.8     # clear: mean kt >= this and variability < low_variability
  overcast_max_mean_kt: 0.5  # overcast: mean kt < this and variability < low_variability
  low_variability: 0.03      # RMS of successive kt differences; everything else is partly cloudy
split_check:                 # criterion for the gate_fit period, fixed before sky_mix.csv was read
  min_variable_days: 30      # partly-cloudy days in gate_fit
  min_variable_share: 0.15   # partly-cloudy share of classified days in gate_fit
nam:
  availability_lag_hours: 6  # assumed delay from 12Z reference time to availability; unverified
satellite:
  availability_lag_minutes: 15  # assumed delay from frame time stamp to availability; unverified
  benchmark_window_minutes: 30  # benchmark feature = mean of frames stamped in (t-30min, t]
anchors:                     # benchmark persistence and linear models (logic of Forecast_intra-day.py)
  targets: [ghi, dni]
  fit_split: models_train
  eval_split: validation
  kt_clip: [0.0, 1.0]        # as in the benchmark script (its comment says 1.1; the code uses 1)
  night_elevation: 5.0       # predictions below this solar elevation are excluded
  cv_folds: 10               # RidgeCV and LassoCV, as in the benchmark script
  lasso_max_iter: 10000
tiers:                       # Stage 5; see docs/PLAN.md section 6
  daylight_min_elevation: 5.0
  kt_clip: [0.0, 1.2]
  early_stop_days: 30        # last days of models_train, used only for early stopping
  sat_max_age_minutes: 60    # frame "available" if stamped in [t-lag-60min, t-lag]
  sat_lag_sensitivity: 0     # "benchmark convention (sensitivity)" variant
  nam_valid_offset_minutes: -15   # NAM valid time = t + h - 15 min (target-window midpoint)
  nam_interp_max_gap_h: 3    # interpolate between valid times of one run up to this gap
  nam_min_clear: 10.0        # W/m2; dwsw/clear left missing below this clear-sky value
  nam_ratio_clip: [0.0, 2.0]
  device: cuda
  batch_size: 256
  lr: 0.001
  weight_decay: 0.0001
  max_epochs: 300
  patience: 20
  edge:
    hidden: [64, 64]
  cloud:
    hidden: [128, 64]
    cnn_channels: [16, 32]
    fusion_hidden: 64
  base_variant:
    sat_frames: 1
    sat_diffs: false
    sat_lookback_minutes: 60
    nwp_extra: false
ladder:
  step2: {sat_frames: 4, sat_diffs: true, sat_lookback_minutes: 120}
  step3: {nwp_extra: true}
  step4:
    max_iter: 500
    learning_rate: 0.05
    max_leaf_nodes: 31
    # iterations chosen on the same early-stop slice (staged predictions), no random split
  step5: {min_horizon_gain: 0.05}
control:                     # Stage 6a model-type control; see docs/PLAN.md section 7
  row_sets: [primary, all_daylight]
  nam_extra: true            # the step-3 NAM block
  reuse_predictions:         # saved Stage 5 validation predictions (deterministic training)
    edge: checkpoints/tiers/base/edge_seed{seed}_pred_kt.npy
    step3_network: checkpoints/tiers/step3/cloud_seed{seed}_pred_kt.npy
footprint:                   # see docs/PLAN.md section 8
  cap_multiples: [10, 100]   # x the edge network's estimated int8 size
  cap_max_leaf_nodes: [8, 31]
  bytes_per_node: 12
  int8_bias_bytes: 4
  int8_bytes_per_tensor_qparams: 8
  timing_repeats: 200
ramp:
  delta_kt: 0.25             # |kt(t,h) - kt(t,h-30min)| >= this; kt(t,0) = B(ghi_kt|30min)
gates:
  n_random_draws: 200
  variability_feature: "ih_V(ghi_kt|30min)"
  forbidden_input_substrings: [sat, nam, cloud, sif]
  net_hidden: [32]
  es_days: 30                # last days of gate_fit, early stopping only
  uncertainty_scale: 100.0   # W/m2
  benefit_scale: 10000.0     # (W/m2)^2
  thresholds_file: configs/gate_thresholds.yaml
